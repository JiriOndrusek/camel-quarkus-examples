# The bucket mirrored into the knowledge base. The pipeline itself is declared in Java — see
# ManualsPipeline — and reads these values, so they can differ per environment: the defaults
# below match the local S3-compatible container from the README, the tests override the
# endpoint with the container they start, and against real AWS the endpoint stays empty.
s3.bucket=manuals
s3.region=us-east-1
s3.access-key=test
s3.secret-key=test
s3.endpoint-override=http://localhost:4566

# The sync ledger lives in the application's default datasource and the vectors in pgvector —
# in dev and test mode the same Dev Services PostgreSQL serves both, zero setup (the pgvector
# extension picks a pgvector-enabled image automatically).
quarkus.langchain4j.pgvector.dimension=384

# The assistant's chat model. The RAG side needs NO wiring: the ingest extension auto-produces
# a RetrievalAugmentor for the pipeline and @RegisterAiService picks it up as the CDI default.
quarkus.langchain4j.ollama.chat-model.model-id=llama3.2
quarkus.langchain4j.ollama.timeout=60s
# embeddings stay with the local ONNX model — one embedding space for ingestion and retrieval
quarkus.langchain4j.ollama.embedding-model.enabled=false
# the tests exercise retrieval without an LLM; run Ollama yourself for /chat (see the README)
quarkus.langchain4j.ollama.devservices.enabled=false

# The S3-compatible container image used by the tests
floci.container.image=mirror.gcr.io/floci/floci:1.5.28
