# A knowledge base that STAYS CORRECT: mode=sync. An edited file replaces its previous
# vectors, a deleted file disappears (behind the safety interlock), an unchanged corpus costs
# nothing on restart. The sync ledger lives in the application's datasource — in dev mode,
# Dev Services starts PostgreSQL automatically, no configuration needed.
quarkus.camel.ai.ingest.manuals.source.type=file
quarkus.camel.ai.ingest.manuals.source.directory=data/manuals
quarkus.camel.ai.ingest.manuals.source.poll-interval=2000
quarkus.camel.ai.ingest.manuals.mode=sync

# pgvector overwrites on same-id writes (measured), so replacement is a plain upsert
quarkus.camel.ai.ingest.manuals.write-strategy=upsert

# declare the model identity: bump it if the embedding model ever changes, so the corpus
# re-embeds instead of silently mixing two embedding spaces
quarkus.camel.ai.ingest.manuals.embedding-model-id=all-minilm-l6-v2@1

# deletion safety: a pass refuses to delete more than half the corpus without explicit consent
quarkus.camel.ai.ingest.manuals.reconcile.bulk-delete-threshold=0.5

# the vector store: Quarkus LangChain4j pgvector, sharing the same Dev Services PostgreSQL
quarkus.langchain4j.pgvector.dimension=384

# scrape-friendly metric names for the cq.ingest.* counters at /q/metrics
quarkus.micrometer.export.prometheus.enabled=true
