#
# Quarkus
#
quarkus.banner.enabled = false
quarkus.log.file.enabled = true

# HTTPS Configuration with PQC Support (Java 21 + BouncyCastle JSSE)
quarkus.http.ssl-port = 8443
quarkus.http.insecure-requests = disabled

# Server keystore (classpath resource for native mode compatibility)
quarkus.http.ssl.certificate.key-store-file = certs/server-keystore.p12
quarkus.http.ssl.certificate.key-store-password = changeit
quarkus.http.ssl.certificate.key-store-file-type = PKCS12

# Require client certificates
quarkus.http.ssl.client-auth = required

# Truststore for client certificate validation (classpath resource for native mode compatibility)
quarkus.http.ssl.certificate.trust-store-file = certs/server-truststore.p12
quarkus.http.ssl.certificate.trust-store-password = changeit
quarkus.http.ssl.certificate.trust-store-file-type = PKCS12

# TLS 1.3 configuration
# Protocol version - TLS 1.3 supports hybrid key exchange algorithms
quarkus.http.ssl.protocols = TLSv1.3

# Cipher suites - let BCJSSE use defaults (restricting them causes issues in native mode)
# The PQC hybrid key exchange (X25519MLKEM768) is configured via named groups
# in SecurityConfiguration using jdk.tls.namedGroups system property
#quarkus.http.ssl.cipher-suites = TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256

#
# Quarkus - Camel
#
quarkus.camel.health.enabled = true

#
# Camel
#
camel.context.name = quarkus-camel-example-http-pqc-j21-03

#
# Camel SSL Context Configuration (oscerd/camel-pqc-tls style)
# Based on: https://github.com/oscerd/camel-pqc-tls/blob/main/pqc-ssl-context-jdk21/src/main/resources/application.properties
#
camel.ssl.enabled = true
camel.ssl.provider = BCJSSE
camel.ssl.secureSocketProtocol = TLSv1.3

#
# BouncyCastle native image configuration
# The camel-quarkus-support-bouncycastle extension provides native-image
# configuration for BouncyCastle, including runtime initialization of
# crypto classes that use SecureRandom.
#
# We also need to initialize SecurityConfiguration and DefaultSecureRandomProvider
# at runtime to ensure the static block runs and pre-initializes SecureRandom
# before SSL contexts are created.
#
quarkus.native.additional-build-args=--initialize-at-run-time=org.acme.http.pqc.SecurityConfiguration,--initialize-at-run-time=org.acme.http.pqc.DefaultSecureRandomProvider
