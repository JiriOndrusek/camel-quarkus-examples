#
# Quarkus
#
quarkus.banner.enabled = false
quarkus.log.file.enabled = true

# HTTPS Configuration with PQC Support via Quarkus TLS Registry (JDK 25+)
# Use port 0 to get a random available port (prevents port conflicts in tests)
quarkus.http.ssl-port = 0
quarkus.http.insecure-requests = disabled
quarkus.http.ssl.client-auth = required
quarkus.http.tls-configuration-name = <default>

# Quarkus TLS Registry configuration
quarkus.tls.key-store.p12.path = target/certs/server-keystore.p12
quarkus.tls.key-store.p12.password = changeit
quarkus.tls.trust-store.p12.path = target/certs/server-truststore.p12
quarkus.tls.trust-store.p12.password = changeit
quarkus.tls.protocols = TLSv1.3

# PQC key exchange configuration — X25519MLKEM768 with classical fallback
# On JDK 25+, SunJSSE natively supports these hybrid PQC key exchange groups
quarkus.tls.key-exchange-protocols = X25519MLKEM768,x25519,secp256r1

#
# Quarkus - Camel
#
quarkus.camel.health.enabled = true

#
# Native image configuration - include certificate files as resources
#
quarkus.native.resources.includes = target/certs/*.p12
